# 仓库级 version catalog（it-020）
# 六个构建（wardrobe / eats / libs/{store,sync,carddeck,cutout}）统一引用此文件，
# 各自 settings.gradle.kts 的 dependencyResolutionManagement.versionCatalogs 里 from(files(...))。
# 之前 Kotlin/AGP/Compose 等版本在 6 处手工重复 pin、无护栏（架构评审 P1-2）。
# onnxruntime 与 onnxruntime-android 版本必须对齐（cutout ADR-002）。

[versions]
agp = "8.7.3"
kotlin = "2.1.21"
coroutines = "1.9.0"
serializationJson = "1.8.0"
composeBom = "2025.06.01"
composeMaterial3 = "1.4.0"          # Material3 Expressive 锁定（wardrobe ADR-004）
coreKtx = "1.15.0"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
navigationCompose = "2.8.5"
datastore = "1.1.1"
exifinterface = "1.3.7"
work = "2.10.0"
coil = "2.7.0"
lottie = "6.7.1"
osmdroid = "6.1.20"
onnxruntime = "1.20.0"
okhttp = "4.12.0"
junit = "4.13.2"
swipeableCards = "1.1.4"            # carddeck 薄封装的三方库（JitPack）
leoStore = "0.1.0"                  # composite build 内坐标（与 libs/store version 一致）
leoCarddeck = "0.1.0"
leoCutout = "0.1.0"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "composeMaterial3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-animation = { module = "androidx.compose.animation:animation" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-runtime = { module = "androidx.compose.runtime:runtime" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
lottie-compose = { module = "com.airbnb.android:lottie-compose", version.ref = "lottie" }
osmdroid-android = { module = "org.osmdroid:osmdroid-android", version.ref = "osmdroid" }
onnxruntime = { module = "com.microsoft.onnxruntime:onnxruntime", version.ref = "onnxruntime" }
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
junit = { module = "junit:junit", version.ref = "junit" }
swipeable-cards = { module = "com.github.smartword-app:compose-swipeable-cards", version.ref = "swipeableCards" }

leo-store = { module = "com.leo.libs:store", version.ref = "leoStore" }
leo-carddeck = { module = "com.leo.libs:carddeck", version.ref = "leoCarddeck" }
leo-cutout = { module = "com.leo.libs:cutout", version.ref = "leoCutout" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
