<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>赤峰环线 · M0</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none;
    background: #0b0d12; color: #f5ead2;
    font-family: "Songti SC", "STSong", "Noto Serif SC", serif;
    -webkit-user-select: none; user-select: none;
  }
  #app { position: fixed; inset: 0; touch-action: none; }
  #app canvas { display: block; touch-action: none; }

  #hint {
    position: fixed; top: calc(14px + env(safe-area-inset-top)); left: 50%;
    transform: translateX(-50%); z-index: 5; pointer-events: none;
    padding: 8px 20px; border-radius: 999px; white-space: nowrap;
    font-size: 13px; letter-spacing: .14em;
    color: rgba(245, 234, 210, .92);
    background: rgba(18, 15, 12, .45);
    border: 1px solid rgba(245, 234, 210, .16);
    backdrop-filter: blur(8px);
    text-shadow: 0 1px 6px rgba(0, 0, 0, .6);
    transition: opacity .8s;
  }
  #stick {
    position: fixed; left: 0; bottom: 0; width: 46vw; height: 46vh;
    z-index: 6; display: none; touch-action: none;
  }
  #jump {
    position: fixed;
    right: calc(26px + env(safe-area-inset-right));
    bottom: calc(96px + env(safe-area-inset-bottom));
    width: 72px; height: 72px; border-radius: 50%; z-index: 6; display: none;
    background: rgba(18, 15, 12, .45);
    border: 1.5px solid rgba(232, 196, 124, .6);
    color: #f5ead2; font-size: 16px; letter-spacing: .1em;
    font-family: inherit; backdrop-filter: blur(6px);
    -webkit-tap-highlight-color: transparent;
  }
  #jump:active { background: rgba(232, 196, 124, .35); }
  body.touch #stick, body.touch #jump { display: block; }

  #err {
    position: fixed; left: 12px; bottom: 12px; max-width: 70vw; z-index: 9;
    display: none; color: #ffb4b4; font: 12px/1.5 ui-monospace, monospace;
    background: rgba(0, 0, 0, .65); padding: 6px 10px; border-radius: 6px;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="hint">WASD 移动 · 拖拽环视 · 空格跳跃 · 滚轮缩放</div>
  <div id="stick"></div>
  <button id="jump" type="button">跳</button>
  <div id="err"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
